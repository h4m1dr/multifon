# multifon v2 — cores manifest
# Every egress core exposes a SOCKS5 port (and an HTTP port where it has
# one). The menu treats all cores uniformly; adding a core = one block
# here + one start/stop pair in lib/cores.sh.
#
# Status meanings:
#   ready        — works today, wired into the menu
#   experimental — installs and mostly works, known limits, needs review
#   test-only    — install it only to run the test procedure
#                  (docs/TEST-WARP-TOR.md); if it fails it moves to
#                  Phase before 6 or is dropped, never into rotation
#   stub         — listed for the plan, not wired yet (installer refuses)
#
# The YAML is kept flat on purpose (2-space list items, 4-space fields)
# so lib/cores.sh can read it with a tiny awk parser, no yq/python.

cores:
  - name: psiphon
    type: psiphon
    binary: psiphon-tunnel-core-x86_64
    pinned_version: v2.0.43
    pinned_commit: 66e249d
    pinned_release_date: 2026-11-17
    release_source: https://github.com/Psiphon-Labs/psiphon-tunnel-core/releases
    binary_source: https://github.com/Psiphon-Labs/psiphon-tunnel-core-binaries/blob/master/linux/psiphon-tunnel-core-x86_64
    download_url: https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-binaries/master/linux/psiphon-tunnel-core-x86_64
    checksum: none-published-upstream
    checksum_note: Upstream publishes no checksum or signature file for the Linux console binary. The installer verifies ELF magic + non-empty + records the SHA-256 locally in ~/psiphon/.core-sha256 and refuses a changed hash for the same pinned version without confirmation.
    socks_port_range: 1081-1091
    http_port_range: 8081-8091
    sandbox: firejail --noprofile --private=<instance dir>
    status: ready

  - name: warp
    type: wireguard-warp
    binary: wireproxy
    binary_source: https://github.com/windtf/wireproxy/releases
    description: Cloudflare WARP over wireproxy (userspace WireGuard, no kernel interface, no root)
    socks_port_range: 1091-1095
    http_port_range: 8091-8095
    sandbox: none (userspace, no interface)
    status: test-only
    limits: SOCKS5 UDP is not supported by wireproxy yet (upstream TODO) — TCP and DNS-over-TCP/DoH work, raw UDP does not. Needs a WARP registration (wgcf) to generate wireproxy.conf; see docs/TEST-WARP-TOR.md. Marked test-only — hamidr's experience is that WARP usually does not respond (Iranian ISPs block/throttle UDP, fingerprint WireGuard, blacklist engage.cloudflareclient.com:2408; Google also mis-geolocates some Cloudflare egress IPs as Iran/Russia). Fix to try first — WARP-over-MASQUE over HTTP/2 (TCP:443). If the test fails, WARP moves to Phase before 6.

  - name: tor
    type: tor
    binary: tor
    binary_source: apt (Debian/Ubuntu tor package)
    description: Tor client, SOCKS5 on 9050 by default
    socks_port_range: 9050
    http_port_range: none
    sandbox: none
    status: test-only
    limits: Tor exit IPs are heavily blocked by Google and AI services (CAPTCHA/denied) — exits are publicly listed, so blocking is by design, not bad luck. Use for anonymity, not for a clean IPFighter score. High latency. Marked test-only — run docs/TEST-WARP-TOR.md; the expected outcome is that Gemini refuses it; Tor stays a fallback core only.

  - name: geph
    type: geph
    binary: geph4-client
    binary_source: to-be-confirmed
    description: Geph circumvention client as a SOCKS5 core
    socks_port_range: 1096-1099
    http_port_range: none
    sandbox: none
    status: stub
    limits: Upstream binary location is not confirmed yet. The installer in lib/cores.sh refuses rather than downloading from a guessed URL. Confirm the upstream repo in Phase 4.

  - name: arman
    type: mozilla-vpn
    binary: arman-vpn-core
    binary_source: https://github.com/armanlife/arman-vpn-client/releases
    description: Arman VPN — free, open-source VPN on a Firefox Account; Mozilla servers on Fastly infrastructure; 50 GB/month per account; country choice with ping test; Firefox TLS fingerprint. The "Firefox VPN" core from the Obsidian bug list (#8).
    socks_port_range: 1110-1119
    http_port_range: 8110-8119
    sandbox: none
    status: stub
    limits: Headless/server use VERIFIED feasible (research 2026-11-24) — server variant, SOCKS5 127.0.0.1:10810, CLI + web panel 10820, multi-account rotation at 95%. Needs a Firefox Account (no token or credential belongs in this repo) and hamidr's one-time sign-in (panel first; fallback — browser sign-in on Windows/Android + backup zip via scp). Still unverified — the config.json key for the SOCKS credentials, and whether the proxy/panel ports are configurable (two instances side by side). 50 GB/month per account is a hard limit (Psiphon has no such cap).

  - name: workers-vless
    type: cloudflare-workers-vless
    binary: none (serverless — runs on Cloudflare's edge)
    binary_source: https://github.com/cmliu/edgetunnel
    description: Cloudflare Workers VLESS egress (edgetunnel) — a Worker fetches as a Cloudflare edge IP, so the target site sees a foreign IP with zero server load. The new egress core from the serverless research (2026-11-24, ~/workspace/multifon-research/09-serverless-egress.md). Planned for Phase before 6, NOT implemented yet.
    socks_port_range: none (Xray VLESS WS+TLS outbound, port 443)
    http_port_range: none
    sandbox: none
    status: stub
    limits: Free, no credit card — 100,000 requests/day, no bandwidth charge. Needs a UUID (the only auth — keep it secret) and a custom domain on his Cloudflare (reachability of *.workers.dev from Iran is unverified). UNVERIFIED whether Gemini opens through it — Google mis-geolocates some Cloudflare egress IPs as Iran/Russia (BardErrorInfo 1060). Test Gemini/Qwen/muse.ai/Flow through it before relying on it. Cloudflare can disable a Worker at any time — keep it as one egress among several, never the only one. "Masket" is MASQUE (a protocol, not a project); Deno Deploy is shutting down and Lambda needs a card — both out. Vercel is backup-only (10 GB cap).
